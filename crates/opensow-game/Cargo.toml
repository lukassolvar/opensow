[package]
name = "opensow-game"
version = "0.1.0"
description = "Playable OpenSOW prototype: menus and a skirmish on the original levels"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Developer features (headless screenshots and runs, dev tools); release archives are built without them (docs/release.md).
default = ["dev"]
dev = []

[dependencies]
opensow-formats.workspace = true
opensow-viewer = { path = "../opensow-viewer" }
jpeg-decoder = "0.3"
softbuffer = "0.4"
wgpu = "30"
pollster = "1"
winit = "0.30"
rodio = { version = "0.23", default-features = false, features = ["playback"] }
ab_glyph = "0.2.32"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# Linux: play through the PulseAudio server (PulseAudio itself, or PipeWire's pulse server) when one runs, plain ALSA otherwise.
# cpal's ALSA path through PulseAudio's ALSA plugin never starts its streams (docs/audio.md, "PulseAudio"). Same cpal as
# rodio's, so the feature reaches the copy rodio uses.
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18.2", features = ["pulseaudio"] }

[lints]
workspace = true

[build-dependencies]
embed-resource = "3.0.12"
png = "0.17"
