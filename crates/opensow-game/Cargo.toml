[package]
name = "opensow-game"
version = "0.1.0"
description = "Playable OpenSOW prototype: menus and a skirmish on the original levels"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
opensow-formats.workspace = true
opensow-viewer = { path = "../opensow-viewer" }
jpeg-decoder = "0.3"
softbuffer = "0.4"
wgpu = "30"
pollster = "1"
winit = "0.30"
rodio = { version = "0.23", default-features = false, features = ["playback"] }
ab_glyph = "0.2.32"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[lints]
workspace = true
