[package]
name = "opensow-launcher"
version = "0.4.0"
description = "OpenSOW launcher: choose the language and the install folder of each game"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Developer features (headless screenshots and runs, dev tools); release archives are built without them (docs/release.md).
default = ["dev"]
dev = []

[dependencies]
opensow-formats.workspace = true
png = "0.17"
softbuffer = "0.4"
winit = "0.30"
ab_glyph = "0.2.32"
jpeg-decoder = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[lints]
workspace = true

[build-dependencies]
embed-resource = "3.0.12"
png = "0.17"
