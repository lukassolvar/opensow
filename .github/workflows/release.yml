# Release archives for the launcher's self-update (docs/launcher.md "What a release must look like", docs/release.md).
#
# Push a tag `vX.Y.Z` equal to the crates' version: every platform is tested, built and packed, then a DRAFT release with
# all archives and their .sha256 files is created. Publish the draft by hand (not as a pre-release: the launcher and the
# README's "latest release" link ignore those). Run it from the Actions tab (workflow_dispatch) for a dry run that only
# keeps the archives as workflow artifacts.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos-aarch64, os: macos-14, target: aarch64-apple-darwin, test: true }
          - { platform: macos-x86_64, os: macos-14, target: x86_64-apple-darwin, test: false }
          - { platform: windows-x86_64, os: windows-2022, target: x86_64-pc-windows-msvc, test: true }
          # Ubuntu 22.04 for an older glibc, so the build runs on more distributions
          - { platform: linux-x86_64, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, test: true }
          - { platform: linux-aarch64, os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, test: true }
    defaults:
      run:
        shell: bash
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the crates' version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/opensow-launcher/Cargo.toml | head -1)
          if [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match the crates' version $version (the launcher would offer the update forever)"
            exit 1
          fi

      - name: Linux libraries (ALSA, PulseAudio)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libpulse-dev libxkbcommon-dev libwayland-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Tests that need the game's files skip without an install
      - name: Test
        if: matrix.test
        run: cargo test --release --target ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p opensow-launcher -p opensow-game
        env:
          # Windows: no console window behind the launcher and the game (only in release archives; cargo builds keep the
          # console for the headless switches' output)
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C link-arg=/SUBSYSTEM:WINDOWS -C link-arg=/ENTRY:mainCRTStartup' || '' }}

      - name: Pack
        run: scripts/package.sh ${{ matrix.platform }} target/${{ matrix.target }}/release dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "OpenSOW ${GITHUB_REF_NAME#v}" --generate-notes
