# A tag `vX.Y.Z` equal to the crates' version builds every platform's release file (build.yml) and opens a DRAFT release
# with them (docs/release.md). The notes come from `docs/releases/<tag>.md` when it exists, else GitHub generates them;
# its translations `docs/releases/<tag>.<lang>.md` are attached as files for the launcher.
# Publish the draft by hand as a normal release, not a pre-release: the launcher and the README's "latest release" link
# ignore pre-releases.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the crates' version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/opensow-launcher/Cargo.toml | head -1)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the crates' version $version (the launcher would offer the update forever)"
            exit 1
          fi

  build:
    needs: version
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: docs/releases
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          notes="docs/releases/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then set -- --notes-file "$notes"; else set -- --generate-notes; fi
          # the translated notes (`<tag>.sk.md`, ...) go along as files; the launcher shows them in its language
          shopt -s nullglob
          translated=(docs/releases/"$GITHUB_REF_NAME".*.md)
          gh release create "$GITHUB_REF_NAME" dist/* "${translated[@]}" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "OpenSOW ${GITHUB_REF_NAME#v}" "$@"
